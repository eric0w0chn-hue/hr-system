<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成本利潤 — 鑫系統</title>
<style>
:root{
  --bg:#ECEEF2;--surface:#fff;--surface2:#F4F5F8;--border:#DDE1E9;--border2:#C8CDD8;
  --text:#1A1D23;--text2:#5A6175;--text3:#9AA0B4;--accent:#2D3142;--accent-light:#F0F2F5;
  --ok:#1F9D55;--warn:#D98A00;--danger:#C0392B;--info:#2D6CDF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ── Topbar ── */
.topbar{height:60px;background:var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:200;gap:10px}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1;overflow:hidden}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.back-btn{font-size:12px;padding:0 13px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.2);font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0;min-height:44px;display:flex;align-items:center}
.back-btn:hover{background:rgba(255,255,255,.2)}
.tb-dv{width:1px;height:20px;background:rgba(255,255,255,.2);flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.role-chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);white-space:nowrap;flex-shrink:0}

/* ── Main ── */
.main{max-width:1200px;margin:0 auto;padding:24px 20px}
.hint{font-size:12px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:14px;line-height:1.6}

/* ── 店面選擇 ── */
.storebar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.storebar .lb{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.3px;flex-shrink:0}
.storebar select{flex:1;min-width:160px;font-size:14px;font-weight:700;padding:9px 11px;border:1px solid var(--border2);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;min-height:44px}
.storebar select:focus{outline:none;border-color:var(--accent)}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{font-size:13px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:38px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .cnt{font-size:11px;background:rgba(0,0,0,.08);padding:0 7px;border-radius:10px;min-width:18px;text-align:center}
.tab.active .cnt{background:rgba(255,255,255,.22)}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px}
.stat-card .n{font-size:23px;font-weight:800;line-height:1.15;word-break:break-all}
.stat-card .l{font-size:11.5px;color:var(--text2);margin-top:6px}
.stat-card.s-a .n{color:var(--info)} .stat-card.s-b .n{color:var(--ok)}
.stat-card.s-c .n{color:var(--warn)} .stat-card.s-d .n{color:var(--danger)}

/* ── Toolbar / Buttons ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;min-height:44px}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:var(--accent)}
.grow{flex:1;min-width:150px}
.btn{font-size:13px;padding:0 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);min-height:44px;white-space:nowrap}
.btn:hover{background:var(--accent-light);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#3D4158}
.btn-danger{background:#FEECEB;color:#C0392B;border-color:#FCA5A5}
.btn-sm{font-size:12px;padding:0 11px;min-height:36px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.icon-btn:hover{background:var(--accent-light);color:var(--text)}
.badge{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.b-食材{background:#E5EEFB;color:var(--info)}
.b-耗材{background:#FFF1DC;color:var(--warn)}
.b-warn{background:#FCE9E7;color:var(--danger)}
.b-gray{background:var(--surface2);color:var(--text2)}
.b-tax{background:#EDE9FE;color:#6D28D9}
.sec-label{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.3px;margin:4px 0 9px}
.tax-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-left:4px solid var(--border2);margin-bottom:18px;flex-wrap:wrap}
.tax-card.on{border-left-color:#6D28D9}
.tx-main{flex:1;min-width:0}
.tx-t{font-size:15px;font-weight:700}
.tx-d{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
.tx-right{display:flex;align-items:center;gap:12px;flex-shrink:0;margin-left:auto}
.tx-rate{font-size:22px;font-weight:800;color:#6D28D9;line-height:1}
.tx-rate small{font-size:12px;font-weight:700}
.chk-row{display:flex;align-items:flex-start;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:14px;cursor:pointer;font-size:13px;font-weight:600;line-height:1.5}
.chk-row input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:#6D28D9}
.chk-row small{display:block;font-size:11px;color:var(--text2);font-weight:400;margin-top:2px}
.empty{text-align:center;padding:44px 16px;color:var(--text3);font-size:14px;line-height:1.9}
.ro-note{font-size:11.5px;color:var(--warn);background:#FFF8EC;border:1px solid #F2CE8A;border-radius:8px;padding:8px 12px;margin-bottom:12px}

/* ── 商品定價表 ── */
.tb-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.pt{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-size:13px}
table.pt th,table.pt td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
table.pt thead th{font-size:11px;font-weight:700;color:var(--text2);background:var(--surface2);border-bottom:1px solid var(--border2);text-align:right;position:sticky;top:0;z-index:3}
table.pt thead tr.h1 th{border-bottom:1px solid var(--border)}
table.pt thead tr.h1 th.ch{text-align:center;color:var(--text);font-size:11.5px;border-left:2px solid var(--border2)}
table.pt th.nm,table.pt td.nm{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;min-width:130px;max-width:190px;white-space:normal}
table.pt thead th.nm{background:var(--surface2);z-index:4}
table.pt td.nm{font-weight:700;cursor:pointer}
table.pt td.gl{border-left:2px solid var(--border2)}
table.pt th.gl{border-left:2px solid var(--border2)}
table.pt tbody tr.pr:hover td{background:#FAFBFD}
table.pt tbody tr.pr:hover td.nm{background:#FAFBFD}
table.pt tbody tr:last-child td{border-bottom:none}
.ch-fee{font-weight:400;color:var(--text3);font-size:10.5px}
.sub-note{font-size:11px;color:var(--text3);font-weight:400;margin-top:2px}
#itable{min-width:560px}
.rate{display:inline-block;font-weight:800;padding:2px 8px;border-radius:20px;font-size:12px}
.r-good{background:#E3F5EA;color:var(--ok)} .r-mid{background:#E5EEFB;color:var(--info)}
.r-low{background:#FFF1DC;color:var(--warn)} .r-bad{background:#FCE9E7;color:var(--danger)}
.r-na{background:var(--surface2);color:var(--text3)}
.cost-cell{font-weight:700;color:var(--text)}
.dim{color:var(--text3)}
.exp{font-size:10px;color:var(--text3);font-weight:400;margin-left:4px}

/* 展開明細列 */
tr.det>td{background:var(--surface2);padding:14px 14px;text-align:left;white-space:normal;border-left:none!important}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.det-h{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:7px;letter-spacing:.3px}
table.mini{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface);border-radius:8px;overflow:hidden}
table.mini th{font-size:10.5px;color:var(--text2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.mini tr:last-child td{border-bottom:none}
table.mini tfoot td{font-weight:800;background:var(--accent-light)}
.det-act{display:flex;gap:8px;margin-top:12px}
.miss{color:var(--danger);font-size:11px}

/* ── 原料卡 ── */
.ilist{display:flex;flex-direction:column;gap:10px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-left:4px solid var(--info)}
.item-card.c-耗材{border-left-color:var(--warn)}
.ic-main{flex:1;min-width:0}
.ic-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ic-formula{font-size:12px;color:var(--text2);margin-top:4px}
.ic-cost{text-align:right;flex-shrink:0}
.ic-cost .v{font-size:20px;font-weight:800;color:var(--accent);line-height:1}
.ic-cost .u{font-size:11px;color:var(--text3);margin-top:3px}
.ic-act{display:flex;gap:6px;flex-shrink:0}

/* ── 平台卡 ── */
.plat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-left:4px solid #7C3AED}
.pl-fee{font-size:22px;font-weight:800;color:#7C3AED;line-height:1;flex-shrink:0}
.pl-fee small{font-size:12px;font-weight:700}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:500;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:620px;padding:24px 20px 32px;box-shadow:0 -8px 40px rgba(0,0,0,.15);max-height:92vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.modal-sub{font-size:11.5px;color:var(--text3);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;min-height:44px}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--accent)}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.req::after{content:' *';color:var(--danger)}
.modal-footer{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.modal-footer .btn{flex:1;justify-content:center}
.calc-preview{background:var(--accent-light);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.calc-preview .v{font-size:20px;font-weight:800;color:var(--accent)}
.sec-h{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.3px;margin:18px 0 8px}

/* 組成編輯器 */
.comp-editor{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.comp-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.comp-row:last-child{border-bottom:none}
.comp-row select{flex:1;min-width:0;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;background:var(--surface);color:var(--text);min-height:40px}
.comp-row input.qty{width:66px;font-size:13px;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;text-align:center;min-height:40px}
.comp-row .sub{width:74px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.comp-row .rm{width:34px;height:34px;flex-shrink:0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;font-size:15px}
.comp-row .rm:hover{background:#FEECEB;color:var(--danger);border-color:#FCA5A5}
.comp-add{padding:9px 10px;background:var(--surface2)}

/* 通道定價編輯 */
.ch-editor{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px}
.ch-row{padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.ch-row:last-child{border-bottom:none}
.ch-top{display:flex;align-items:center;gap:10px}
.ch-nm{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-top input{width:96px;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;text-align:right;min-height:40px;flex-shrink:0}
.ch-out{font-size:11.5px;color:var(--text2);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ch-out b{color:var(--text)}
.ch-out .p b{color:var(--ok)} .ch-out .p.neg b{color:var(--danger)}
.cost-banner{background:var(--accent);color:#fff;border-radius:12px;padding:13px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
.cost-banner .v{font-size:21px;font-weight:800}

/* ── Toast / Loading ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1D23;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;visibility:hidden;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;visibility:visible}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;gap:8px;font-size:13px;color:var(--text3)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* ── RWD ── */
@media(max-width:600px){
  .topbar{padding:0 12px;gap:6px;height:52px}
  .topbar h1{font-size:13px}
  .back-btn{font-size:11px;padding:0 10px;min-height:36px}
  .role-chip{font-size:10px;padding:2px 8px}
  #btnNew .btn-label{display:none}
  #btnNew{padding:0 11px;min-width:36px;justify-content:center}
  #btnCsv{display:none}
  .main{padding:12px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:12px}
  .stat-card .n{font-size:19px}
  .toolbar select,.toolbar input{width:100%}
  .form-3{grid-template-columns:1fr 1fr}
  .item-card,.plat-card{flex-wrap:wrap;gap:10px}
  .ic-main{flex:1 1 60%}
  .ic-act{margin-left:auto}
  .comp-row{flex-wrap:wrap}
  .comp-row select{flex:1 1 100%}
  .det-grid{grid-template-columns:1fr;gap:14px}
  table.pt th.nm,table.pt td.nm{min-width:104px;max-width:120px;font-size:12px}
  table.pt th,table.pt td{padding:8px 8px;font-size:12px}
  .modal{border-radius:16px 16px 0 0;max-height:92vh}
}
@media(min-width:601px){
  .overlay{align-items:center;padding:16px}
  .modal{border-radius:16px;max-height:88vh}
}
/* ── embed 隱藏 topbar（iframe 模式必加）── */
[data-embed="1"] .topbar,[data-embed="1"] .topbar *{display:none!important;height:0!important;min-height:0!important;overflow:hidden!important}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>載入中…</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="btnBack">← 主選單</button>
      <div class="tb-dv"></div>
      <h1>🧮 成本利潤</h1>
    </div>
    <div class="topbar-right">
      <button class="btn" id="btnCsv">匯出CSV</button>
      <button class="btn btn-primary" id="btnNew">＋<span class="btn-label"> 新增</span></button>
      <span class="role-chip" id="roleChip">—</span>
    </div>
  </div>

  <div class="main">
    <div class="storebar">
      <span class="lb">🏪 目前店面</span>
      <select id="selStore"></select>
    </div>

    <div class="hint" id="hintBox"></div>
    <div class="ro-note" id="roNote" style="display:none">🔒 此店面非您的管轄範圍，目前為<b>唯讀檢視</b>。</div>

    <div class="tabs" id="tabs"></div>

    <!-- ══ 商品定價 ══ -->
    <div id="viewProd">
      <div class="stats">
        <div class="stat-card s-a"><div class="n" id="stCount">0</div><div class="l">商品數</div></div>
        <div class="stat-card s-b"><div class="n" id="stAvg">—</div><div class="l">現場平均毛利率</div></div>
        <div class="stat-card s-c"><div class="n" id="stPavg">—</div><div class="l">平台平均毛利率</div></div>
        <div class="stat-card s-d"><div class="n" id="stBad">0</div><div class="l">🔴 虧損通道數</div></div>
      </div>
      <div class="toolbar">
        <input type="text" id="fpSearch" class="grow" placeholder="🔍 搜尋商品名稱…">
        <select id="fpSort">
          <option value="name">名稱排序</option>
          <option value="rate_asc">現場毛利率 低→高</option>
          <option value="rate_desc">現場毛利率 高→低</option>
          <option value="cost_desc">成本 高→低</option>
        </select>
      </div>
      <div class="tb-wrap"><table class="pt" id="ptable"></table></div>
      <div id="pEmpty"></div>
    </div>

    <!-- ══ 原料成本 ══ -->
    <div id="viewItem" style="display:none">
      <div class="toolbar">
        <input type="text" id="fiSearch" class="grow" placeholder="🔍 搜尋原料名稱…">
        <select id="fiCat">
          <option value="__all__">全部分類</option>
          <option value="食材">🥬 食材</option>
          <option value="耗材">📦 耗材</option>
        </select>
      </div>
      <div class="tb-wrap"><table class="pt" id="itable"></table></div>
      <div id="iEmpty"></div>
    </div>

    <!-- ══ 平台服務費 ══ -->
    <div id="viewPlat" style="display:none">
      <div id="taxBox"></div>
      <div class="sec-label">🚚 外送平台服務費</div>
      <div class="ilist" id="pllist"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { authGuard, db, writeOpLog, getLocationTypes } from './auth-guard.js?v=2';
import { collection, getDocs, doc, getDoc, addDoc, updateDoc, setDoc, deleteDoc, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ─────────── 設定 ─────────── */
const COLL_ITEM = 'cost_items';       // 原料／耗材（分店）
const COLL_PROD = 'cost_products';    // 商品（分店）
const COLL_PLAT = 'cost_platforms';   // 外送平台服務費（分店）
const DOC_TAX   = ['settings','cost_tax'];  // 各店開發票設定（單一文件，key=店名）
const FETCH_LIMIT = 3000;
const DEF_TAX_RATE = 5;   // 預設營業稅率（%），依售價計入成本
const CATS  = ['食材','耗材'];
const UNITS = ['份','個','杯','包','片','組'];
const FALLBACK_STORES = ['鑫耀鑫餐廳','梁鑫雞肉飯專門店','鑫營雞肉本舖','府中雞肉飯專門店','景新雞肉飯專門店','鑫雞肉央廚','大直讚雞肉飯','心惦雞肉飯','幸福雞肉飯','福城雞肉飯','泉州鑫廚房','新莊央廚','巷日雞肉飯'];

const CUR = { role:'', name:'—', uid:'' };
let VIEW_LOCS = [];      // 可檢視店面（authGuard 已過濾）
let OWN_LOCS  = [];      // 可編輯店面（userData.locations；admin/consultant 為全店）
let ALL_ITEMS = [], ALL_PRODS = [], ALL_PLATS = [];   // 全部資料（含 store 欄位）
let TAX_ALL = {};        // { [店名]: {invoice:bool, rate:number} }
let TAX = { invoice:false, rate:DEF_TAX_RATE };   // 目前店面的開發票設定
let ITEMS = [], PRODS = [], PLATS = [];               // 目前店面
let STORE = '';
let TAB = 'prod';
let canEdit = false;     // 目前店面是否可編輯

/* ─────────── 小工具 ─────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2  = n => Math.round(n*100)/100;
const money = n => (Math.round(n*100)/100).toLocaleString('zh-TW',{minimumFractionDigits:0,maximumFractionDigits:2});
// 全站店名正規化（舖/鋪 異體字）
function normLoc(s){ return (s||'').replace(/鋪/g,'舖').replace(/　/g,' ').trim(); }
const sameLoc = (a,b) => normLoc(a) === normLoc(b);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

// 單份成本：進貨價 ÷ 可產份數
function unitCost(it){ const q = num(it.yieldQty); return q > 0 ? num(it.packPrice)/q : 0; }

// 通道清單：現場 + 各外送平台
function channels(){
  return [{ id:'onsite', name:'🏠 現場', fee:0, fixed:0 }]
    .concat(PLATS.map(p => ({ id:p.id, name:p.name, fee:num(p.feePct), fixed:num(p.fixedFee) })));
}

// 商品試算（成本即時對照目前原料價）
function calcProduct(p){
  const rows = (p.comps||[]).map(c => {
    const it = ITEMS.find(x => x.id === c.itemId);
    const uc = it ? unitCost(it) : 0;
    const qty = num(c.qty) || 0;
    return { name: it ? it.name : (c.name || '（原料已刪除）'), missing: !it,
             unit: it ? (it.unit||'份') : '份', uc, qty, sub: uc*qty };
  });
  const cost = rows.reduce((s,r)=>s+r.sub, 0);
  const taxable = TAX.invoice === true;   // 開發票為「單店全商品」設定
  const chs = channels().map(ch => {
    const price = ch.id==='onsite' ? num(p.price) : num((p.chPrices||{})[ch.id]);
    const svc    = price>0 ? price*ch.fee/100 + ch.fixed : 0;    // 服務費（抽佣＋固定費）
    const tax    = (taxable && price>0) ? price*num(TAX.rate)/100 : 0; // 營業稅（開發票）
    const net    = price - svc;                                   // 平台實收
    const profit = price - svc - tax - cost;                      // 毛利
    const rate   = price>0 ? profit/price*100 : null;              // 毛利率＝毛利÷售價
    return { ...ch, price, svc, tax, net, profit, rate, deduct: svc+tax, set: price>0 };
  });
  return { rows, cost, chs, taxable, hasMissing: rows.some(r=>r.missing) };
}

function rateCls(rate){
  if(rate === null) return 'r-na';
  if(rate < 0) return 'r-bad';
  if(rate < 20) return 'r-low';
  if(rate < 45) return 'r-mid';
  return 'r-good';
}
const rateHtml = r => `<span class="rate ${rateCls(r)}">${r===null?'—':r.toFixed(1)+'%'}</span>`;

/* ─────────── 進場 ─────────── */
authGuard('cost', ({ uid, role, locations, userData }) => {
  CUR.role = role; CUR.uid = uid; CUR.name = userData?.name || '—';
  VIEW_LOCS = Array.isArray(locations) ? locations.slice() : [];
  // ownLocs 與檢視範圍分離（規範 3-2）：admin/consultant 的 userData.locations 為空 → 視為全店
  OWN_LOCS  = (userData?.locations && userData.locations.length) ? userData.locations.slice() : [];
  const rc = $('roleChip');
  if(rc) rc.textContent = ({admin:'管理員',consultant:'顧問',manager:'店長/副店長',employee:'同仁'})[role] || role || '—';
  init();
});

async function loadAllStores(){
  try{
    const s = await getDoc(doc(db,'hr','settings'));
    if(s.exists()){
      const wl = s.data().workLocations;
      if(Array.isArray(wl) && wl.length){
        const names = wl.map(x => typeof x==='string' ? x : (x?.name||x?.store||x?.label||'')).filter(Boolean);
        if(names.length) return names;
      }
    }
  }catch(e){ console.warn('loadAllStores 失敗，改用後備清單', e); }
  return FALLBACK_STORES.slice();
}

async function init(){
  $('btnBack').addEventListener('click', () => {
    if(window.self !== window.top){ window.parent.postMessage({type:'navigate',page:'dashboard.html'},'*'); }
    else { window.location.href = 'dashboard.html'; }
  });
  $('btnNew').addEventListener('click', onNew);
  $('btnCsv').addEventListener('click', exportCsv);
  $('fpSearch').addEventListener('input', renderProds);
  $('fpSort').addEventListener('change', renderProds);
  $('fiSearch').addEventListener('input', renderItems);
  $('fiCat').addEventListener('change', renderItems);
  $('selStore').addEventListener('change', () => { STORE = $('selStore').value; onStoreChange(); });

  // 店面清單：VIEW_LOCS 為空（admin/consultant 全域）→ 讀全站店面
  let stores = VIEW_LOCS.length ? VIEW_LOCS.slice() : await loadAllStores();
  stores = stores.filter(s => s && s !== '梁平有限公司');   // 公司實體非門市
  // 此模組僅供門市使用：排除 locationType='central' 的央廚（權限管理>店面類型設定）
  try{
    const lt = await getLocationTypes();
    stores = stores.filter(s => (lt[s] || 'store') !== 'central');
  }catch(e){ console.warn('讀取店面類型失敗，不過濾央廚', e); }
  $('selStore').innerHTML = stores.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  STORE = stores[0] || '';
  if(stores.length <= 1) $('selStore').disabled = true;

  await loadAll();
  $('loading').style.display = 'none';
  $('app').style.display = '';
  onStoreChange();
}

async function loadAll(){
  try{
    // 4-2③ 獨立讀取一律 Promise.all 並行；店名不用 where（異體字），前端 normLoc 過濾
    const [si, sp, sl, st] = await Promise.all([
      getDocs(query(collection(db, COLL_ITEM), orderBy('name'), limit(FETCH_LIMIT))),
      getDocs(query(collection(db, COLL_PROD), orderBy('name'), limit(FETCH_LIMIT))),
      getDocs(query(collection(db, COLL_PLAT), orderBy('name'), limit(500))),
      getDoc(doc(db, ...DOC_TAX))
    ]);
    ALL_ITEMS = si.docs.map(d => ({ id:d.id, ...d.data() }));
    ALL_PRODS = sp.docs.map(d => ({ id:d.id, ...d.data() }));
    ALL_PLATS = sl.docs.map(d => ({ id:d.id, ...d.data() }));
    TAX_ALL   = st.exists() ? (st.data().stores || {}) : {};
  }catch(e){
    console.error(e); toast('讀取失敗：'+(e.message||e));
    ALL_ITEMS = []; ALL_PRODS = []; ALL_PLATS = []; TAX_ALL = {};
  }
}

function onStoreChange(){
  ITEMS = ALL_ITEMS.filter(x => sameLoc(x.store, STORE));
  PRODS = ALL_PRODS.filter(x => sameLoc(x.store, STORE));
  PLATS = ALL_PLATS.filter(x => sameLoc(x.store, STORE));
  const tk = Object.keys(TAX_ALL).find(k => sameLoc(k, STORE));
  TAX = { invoice: !!(tk && TAX_ALL[tk].invoice), rate: (tk && num(TAX_ALL[tk].rate)) || DEF_TAX_RATE };
  // 可編輯：OWN_LOCS 為空（總部/顧問全域）→ 全部可編；否則需在 OWN_LOCS 內
  canEdit = OWN_LOCS.length === 0 ? true : OWN_LOCS.some(s => sameLoc(s, STORE));
  $('roNote').style.display = canEdit ? 'none' : '';
  $('btnNew').style.display = canEdit ? '' : 'none';
  renderHint(); renderTabs(); renderProds(); renderItems(); renderPlats();
}

    item:'🧾 填「進貨價 ÷ 可產數量」＝單份成本。例：米 100 元可產 20 份 → 每份 $5。原料價一改，所有用到它的商品成本自動更新。',
    plat:'🚚 設定本店<b>是否開發票</b>與各外送平台的服務費（抽佣％）。例：UBER 30% → 售價 150 時服務費 $45，實收 $105 再扣成本才是毛利。<b>各店可自行設定不同費率。</b>'

/* ═══════════ 商品定價（表格） ═══════════ */
function renderProds(){
  const kw   = $('fpSearch').value.trim().toLowerCase();
  const sort = $('fpSort').value;
  const chs  = channels();
  const calced = PRODS.map(p => ({ p, c: calcProduct(p) }));

  // ── 統計 ──
  const onRates = calced.map(x => x.c.chs[0].rate).filter(r => r !== null);
  const plRates = calced.flatMap(x => x.c.chs.slice(1).filter(ch=>ch.set).map(ch=>ch.rate));
  const badCnt  = calced.reduce((s,x)=> s + x.c.chs.filter(ch=>ch.set && ch.profit<0).length, 0);
  const avg = a => a.length ? (a.reduce((s,v)=>s+v,0)/a.length).toFixed(1)+'%' : '—';
  $('stCount').textContent = PRODS.length;
  $('stAvg').textContent   = avg(onRates);
  $('stPavg').textContent  = avg(plRates);
  $('stBad').textContent   = badCnt;

  let list = calced.filter(x => !kw || String(x.p.name||'').toLowerCase().includes(kw));
  const rk = x => x.c.chs[0].rate === null ? -9999 : x.c.chs[0].rate;
  if(sort==='rate_asc')       list.sort((a,b)=> rk(a)-rk(b));
  else if(sort==='rate_desc') list.sort((a,b)=> rk(b)-rk(a));
  else if(sort==='cost_desc') list.sort((a,b)=> b.c.cost-a.c.cost);
  else list.sort((a,b)=> String(a.p.name).localeCompare(String(b.p.name),'zh-Hant'));

  if(!list.length){
    $('ptable').innerHTML = '';
    $('pEmpty').innerHTML = `<div class="empty">${PRODS.length ? '沒有符合條件的商品'
      : (ITEMS.length ? '此店尚未建立商品<br>點右上「＋ 新增」，把原料組合成商品並填入各通道售價'
                      : '請先到「🧾 原料成本」建立此店的原料<br>再回來組合商品')}</div>`;
    return;
  }
  $('pEmpty').innerHTML = '';

  const colCount = 2 + chs.length*3;
  const head =
    `<thead>
      <tr class="h1">
        <th class="nm" rowspan="2">商品</th>
        <th rowspan="2">成本</th>
        ${chs.map(ch=>`<th class="ch" colspan="3">${esc(ch.name)}${ch.id!=='onsite'?`<span class="ch-fee"> ${money(ch.fee)}%${ch.fixed?` +$${money(ch.fixed)}`:''}</span>`:''}</th>`).join('')}
      </tr>
      <tr>
        ${chs.map(()=>`<th class="gl">售價</th><th>服務費/稅</th><th>毛利 / 毛利率</th>`).join('')}
      </tr>
    </thead>`;

  const body = list.map(({p,c}) => {
    const cells = c.chs.map(ch => {
      if(!ch.set) return `<td class="gl dim">—</td><td class="dim">—</td><td class="dim">—</td>`;
      const pf = `${ch.profit<0?'-':''}$${money(Math.abs(ch.profit))}`;
      const ded = ch.deduct>0
        ? `<span style="color:#7C3AED">-$${money(ch.deduct)}</span>${ch.tax>0&&ch.svc>0?`<span class="ch-fee"> (稅$${money(ch.tax)})</span>`:''}`
        : '<span class="dim">—</span>';
      return `<td class="gl">$${money(ch.price)}</td><td>${ded}</td>`
           + `<td><span style="color:${ch.profit<0?'var(--danger)':'var(--ok)'};font-weight:700;margin-right:6px">${pf}</span>${rateHtml(ch.rate)}</td>`;
    }).join('');
    return `<tr class="pr" data-toggle="${p.id}">
        <td class="nm">${esc(p.name)}${c.hasMissing?' <span class="badge b-warn">原料缺失</span>':''}<span class="exp">▾</span></td>
        <td class="cost-cell">$${money(c.cost)}</td>${cells}
      </tr>
      <tr class="det" id="det_${p.id}" style="display:none"><td colspan="${colCount}">${detailHtml(p,c)}</td></tr>`;
  }).join('');

  $('ptable').innerHTML = head + `<tbody>${body}</tbody>`;
}

function detailHtml(p,c){
  const comp = `<div><div class="det-h">🧾 組成明細</div>
    <table class="mini">
      <thead><tr><th>原料</th><th>單位成本</th><th>數量</th><th>小計</th></tr></thead>
      <tbody>${c.rows.length ? c.rows.map(r=>`<tr>
        <td>${esc(r.name)}${r.missing?' <span class="miss">✕已刪除</span>':''}</td>
        <td>$${money(r.uc)}</td><td>${money(r.qty)} ${esc(r.unit)}</td><td>$${money(r.sub)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="dim">尚未設定組成</td></tr>'}</tbody>
      <tfoot><tr><td>總成本</td><td></td><td></td><td>$${money(c.cost)}</td></tr></tfoot>
    </table></div>`;

  const ch = `<div><div class="det-h">💰 各通道利潤</div>
    <table class="mini">
      <thead><tr><th>通道</th><th>售價</th><th>服務費</th><th>營業稅</th><th>成本</th><th>毛利</th><th>毛利率</th></tr></thead>
      <tbody>${c.chs.map(x=>`<tr>
        <td>${esc(x.name)}${x.id!=='onsite'?` <span class="dim">${money(x.fee)}%</span>`:''}</td>
        ${x.set ? `<td>$${money(x.price)}</td><td style="color:#7C3AED">${x.svc?'-$'+money(x.svc):'—'}</td>
        <td style="color:#7C3AED">${x.tax?'-$'+money(x.tax):'—'}</td><td>-$${money(c.cost)}</td>
        <td style="color:${x.profit<0?'var(--danger)':'var(--ok)'};font-weight:800">${x.profit<0?'-':''}$${money(Math.abs(x.profit))}</td>
        <td>${rateHtml(x.rate)}</td>` : '<td colspan="6" class="dim">未定價</td>'}
      </tr>`).join('')}</tbody>
    </table>
    ${c.taxable?`<div style="font-size:11.5px;color:var(--text2);margin-top:8px">🧾 本店開發票：營業稅 ${money(TAX.rate)}% 依各通道售價計入成本</div>`:''}
    ${p.note?`<div style="font-size:12px;color:var(--text2);margin-top:9px">📝 ${esc(p.note)}</div>`:''}
    ${canEdit?`<div class="det-act">
      <button class="btn btn-sm" data-pedit="${p.id}">✏️ 編輯</button>
      <button class="btn btn-sm btn-danger" data-pdel="${p.id}">🗑 刪除</button></div>`:''}
    </div>`;
  return `<div class="det-grid">${comp}${ch}</div>`;
}

$('ptable').addEventListener('click', e => {
  const ed = e.target.closest('[data-pedit]'); if(ed) return openProdModal(PRODS.find(x=>x.id===ed.dataset.pedit));
  const dl = e.target.closest('[data-pdel]');  if(dl) return delProd(dl.dataset.pdel);
  const tg = e.target.closest('[data-toggle]');
  if(tg){ const d = $('det_'+tg.dataset.toggle); if(d) d.style.display = d.style.display==='none' ? '' : 'none'; }

/* ═══════════ 原料 ═══════════ */
function renderItems(){
  const kw  = $('fiSearch').value.trim().toLowerCase();
  const cat = $('fiCat').value;
  const list = ITEMS.filter(i => cat==='__all__' || i.category===cat)
                    .filter(i => !kw || String(i.name||'').toLowerCase().includes(kw));
  if(!list.length){
    $('itable').innerHTML = '';
    $('iEmpty').innerHTML = `<div class="empty">${ITEMS.length ? '沒有符合條件的原料'
      : '此店尚未建立原料<br>點右上「＋ 新增」開始，例如：米 100 元 可產 20 份'}</div>`;
    return;
  }
  $('iEmpty').innerHTML = '';
  const head = `<thead><tr>
      <th class="nm">名稱</th><th>分類</th><th class="gl">進貨價</th><th>可產數量</th>
      <th class="gl">單位成本</th><th>用於商品</th>${canEdit?'<th>操作</th>':''}
    </tr></thead>`;
  const body = list.map(i => {
    const uc = unitCost(i), u = i.unit || '份';
    const used = PRODS.filter(p => (p.comps||[]).some(c => c.itemId === i.id)).length;
    return `<tr class="pr">
      <td class="nm">${esc(i.name)}${i.note?`<div class="sub-note">${esc(i.note)}</div>`:''}</td>
      <td><span class="badge b-${esc(i.category||'食材')}">${esc(i.category||'食材')}</span></td>
      <td class="gl">$${money(i.packPrice)}</td>
      <td>${money(i.yieldQty)} ${esc(u)}</td>
      <td class="gl cost-cell" style="font-size:15px">$${money(uc)}<span class="ch-fee"> /${esc(u)}</span></td>
      <td>${used ? `<span class="badge b-gray">${used} 項</span>` : '<span class="dim">—</span>'}</td>
      ${canEdit?`<td><div class="ic-act" style="justify-content:flex-end">
        <button class="icon-btn" data-iedit="${i.id}" title="編輯">✏️</button>
        <button class="icon-btn" data-idel="${i.id}" title="刪除">🗑</button></div></td>`:''}
    </tr>`;
  }).join('');
  $('itable').innerHTML = head + `<tbody>${body}</tbody>`;
}
$('itable').addEventListener('click', e => {
  const ed = e.target.closest('[data-iedit]'); if(ed) return openItemModal(ITEMS.find(x=>x.id===ed.dataset.iedit));
  const dl = e.target.closest('[data-idel]');  if(dl) return delItem(dl.dataset.idel);
});

function openItemModal(it){
  const isNew = !it;
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-title">🧾 ${isNew?'新增':'編輯'}原料／耗材</div>
    <div class="modal-sub">店面：${esc(STORE)}</div>
    <div class="form-row"><label class="req">名稱</label>

      <div class="form-row"><label>分類</label><select id="iCat">
        ${CATS.map(c=>`<option value="${c}" ${it?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-row"><label class="req">進貨價</label>
        <input type="number" id="iPrice" inputmode="decimal" step="0.01" min="0" placeholder="100" value="${it?.packPrice??''}"></div>
      <div class="form-row"><label class="req">可產數量</label>
        <input type="number" id="iQty" inputmode="decimal" step="0.01" min="0" placeholder="20" value="${it?.yieldQty??''}"></div>

    <div class="calc-preview"><span>單位成本</span><span class="v" id="iPreview">—</span></div>

      <button class="btn" id="iCancel">取消</button>
      <button class="btn btn-primary" id="iSave">${isNew?'新增':'儲存'}</button></div>
  </div>`;
  document.body.appendChild(ov);

  const upd = () => {
    const pv = num($('iPrice').value), q = num($('iQty').value);
    $('iPreview').textContent = q>0 ? `$${money(pv/q)} / ${$('iUnit').value}` : '—';
  };
  ['iPrice','iQty'].forEach(id => $(id).addEventListener('input', upd));
  $('iUnit').addEventListener('change', upd); upd();

  const close = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target===ov) close(); });
  $('iCancel').addEventListener('click', close);
  $('iSave').addEventListener('click', async () => {
    const name = $('iName').value.trim();
    const packPrice = num($('iPrice').value), yieldQty = num($('iQty').value);
    if(!name) return toast('請填寫名稱');
    if(packPrice <= 0) return toast('進貨價需大於 0');
    if(yieldQty <= 0) return toast('可產數量需大於 0');
    const data = { store:STORE, name, category:$('iCat').value, packPrice, yieldQty,
                   unit:$('iUnit').value, note:$('iNote').value.trim(), updatedAt:serverTimestamp() };
    $('iSave').disabled = true;
    try{
      if(isNew){
        data.createdAt = serverTimestamp();
        const ref = await addDoc(collection(db, COLL_ITEM), data);
        ALL_ITEMS.push({ id:ref.id, ...data });
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'新增原料', detail:`${STORE}／${name}` });
      }else{
        await updateDoc(doc(db, COLL_ITEM, it.id), data);
        Object.assign(it, data);
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'編輯原料', detail:`${STORE}／${name}` });
      }
      ALL_ITEMS.sort((a,b)=> String(a.name).localeCompare(String(b.name),'zh-Hant'));
      close(); refresh(); toast(isNew?'已新增原料':'已儲存');
    }catch(e){ console.error(e); toast('儲存失敗：'+(e.message||e)); $('iSave').disabled=false; }
  });
}

async function delItem(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  const used = PRODS.filter(p => (p.comps||[]).some(c => c.itemId===id));
  const warn = used.length ? `\n\n⚠️ 目前有 ${used.length} 項商品使用此原料（${used.slice(0,3).map(p=>p.name).join('、')}${used.length>3?'…':''}），刪除後成本會少算。` : '';
  if(!confirm(`確定刪除原料「${it.name}」？${warn}`)) return;
  try{
    await deleteDoc(doc(db, COLL_ITEM, id));
    ALL_ITEMS = ALL_ITEMS.filter(x=>x.id!==id);
    writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'刪除原料', detail:`${STORE}／${it.name}` });
    refresh(); toast('已刪除');
  }catch(e){ console.error(e); toast('刪除失敗：'+(e.message||e)); }
}

function openTaxModal(){
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-title">🧾 發票設定</div>
    <div class="modal-sub">店面：${esc(STORE)}（各店可自行設定，僅影響本店商品）</div>
    <label class="chk-row"><input type="checkbox" id="tOn" ${TAX.invoice?'checked':''}>
      <span>本店開發票<small>勾選後，本店<b>所有商品</b>的各通道售價都會扣除營業稅再算毛利</small></span></label>
    <div class="form-row"><label class="req">營業稅率（%）</label>
      <input type="number" id="tRate" inputmode="decimal" step="0.1" min="0" max="100" value="${TAX.rate}"></div>
    <div class="calc-preview"><span>售價 $100 時 → 營業稅</span><span class="v" id="tPreview">—</span></div>
    <div class="modal-footer">
      <button class="btn" id="tCancel">取消</button>
      <button class="btn btn-primary" id="tSave">儲存</button></div>
  </div>`;
  document.body.appendChild(ov);
  const upd = () => {
    const on = $('tOn').checked, r = num($('tRate').value);
    $('tRate').disabled = !on;
    $('tPreview').textContent = on ? `-$${money(100*r/100)}` : '不計稅';
  };
  $('tOn').addEventListener('change', upd);
  $('tRate').addEventListener('input', upd); upd();

  const close = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target===ov) close(); });
  $('tCancel').addEventListener('click', close);
  $('tSave').addEventListener('click', async () => {
    const invoice = $('tOn').checked, rate = num($('tRate').value);
    if(invoice && (rate <= 0 || rate >= 100)) return toast('稅率需在 0.1–99.9% 之間');
    $('tSave').disabled = true;
    try{
      const key = Object.keys(TAX_ALL).find(k => sameLoc(k, STORE)) || STORE;
      const next = { ...TAX_ALL, [key]: { invoice, rate: invoice ? rate : DEF_TAX_RATE } };
      await setDoc(doc(db, ...DOC_TAX), { stores: next, updatedAt: serverTimestamp() }, { merge:true });
      TAX_ALL = next;
      TAX = { invoice, rate: invoice ? rate : DEF_TAX_RATE };
      writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost',
                   action:'編輯發票設定', detail:`${STORE}／${invoice?`開發票 ${rate}%`:'不開發票'}` });
      close(); refresh(); toast('已儲存發票設定');
    }catch(e){ console.error(e); toast('儲存失敗：'+(e.message||e)); $('tSave').disabled=false; }
  });
}

/* ═══════════ 商品 Modal ═══════════ */
function openProdModal(p){
  const isNew = !p;
  if(!ITEMS.length){ toast('請先到「原料成本」建立此店的原料'); return; }
  let comps = (p?.comps||[]).map(c => ({ itemId:c.itemId, qty:num(c.qty)||1 }));
  if(!comps.length) comps = [{ itemId:'', qty:1 }];
  const chs = channels();
  const prices = {};
  chs.forEach(ch => { prices[ch.id] = ch.id==='onsite' ? (p?.price ?? '') : ((p?.chPrices||{})[ch.id] ?? ''); });

  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-title">🍚 ${isNew?'新增':'編輯'}商品</div>
    <div class="modal-sub">店面：${esc(STORE)}${TAX.invoice?` ・🧾 本店開發票（營業稅 ${money(TAX.rate)}%，已計入下方毛利）`:''}</div>
    <div class="form-row"><label class="req">商品名稱</label>
      <input type="text" id="pName" placeholder="例：雞肉飯" value="${esc(p?.name||'')}"></div>
    <div class="sec-h">① 組成（食材＋耗材）</div>
    <div class="comp-editor" id="compEditor"></div>
    <div class="cost-banner"><span>單份總成本</span><span class="v" id="sbCost">$0</span></div>
    <div class="sec-h">② 各通道售價（不填＝該通道未販售）</div>
    <div class="ch-editor" id="chEditor">
      ${chs.map(ch=>`<div class="ch-row">
        <div class="ch-top">
          <span class="ch-nm">${esc(ch.name)}${ch.id!=='onsite'?`<span class="ch-fee"> 服務費 ${money(ch.fee)}%${ch.fixed?` +$${money(ch.fixed)}`:''}</span>`:''}</span>
          <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="售價" data-cp="${ch.id}" value="${prices[ch.id]}">
        </div>
        <div class="ch-out" id="out_${ch.id}"></div>
      </div>`).join('')}
      ${chs.length===1?`<div class="ch-row" style="background:var(--surface2);font-size:12px;color:var(--text2)">尚未設定外送平台 → 到「🚚 平台服務費」新增後，這裡會出現對應欄位。</div>`:''}
    </div>
    <div class="form-row" style="margin-top:14px"><label>備註</label>
      <input type="text" id="pNote" placeholder="口味、份量說明…" value="${esc(p?.note||'')}"></div>
    <div class="modal-footer">
      <button class="btn" id="pCancel">取消</button>
      <button class="btn btn-primary" id="pSave">${isNew?'新增':'儲存'}</button></div>
  </div>`;
  document.body.appendChild(ov);

  const optHtml = sel => '<option value="">— 選擇原料 —</option>' + ITEMS.map(i =>
    `<option value="${i.id}" ${sel===i.id?'selected':''}>${esc(i.name)}（$${money(unitCost(i))}/${esc(i.unit||'份')}）</option>`).join('');

  function curCost(){
    return comps.reduce((s,c) => {
      const it = ITEMS.find(x=>x.id===c.itemId);
      return s + (it ? unitCost(it)*num(c.qty) : 0);
    }, 0);
  }
  function renderComps(){
    $('compEditor').innerHTML = comps.map((c,idx) => {
      const it = ITEMS.find(x=>x.id===c.itemId);
      const sub = it ? unitCost(it)*num(c.qty) : 0;
      return `<div class="comp-row">
        <select data-ci="${idx}">${optHtml(c.itemId)}</select>
        <input class="qty" type="number" inputmode="decimal" step="0.1" min="0" data-cq="${idx}" value="${c.qty}">
        <span class="sub">$${money(sub)}</span>
        <button class="rm" data-cr="${idx}" title="移除">✕</button></div>`;
    }).join('') + `<div class="comp-add"><button class="btn btn-sm" id="compAdd" style="width:100%;justify-content:center">＋ 增加一項原料</button></div>`;
    updAll();
  }
  function updAll(){
    const cost = curCost();
    $('sbCost').textContent = '$' + money(cost);
    chs.forEach(ch => {
      const inp = ov.querySelector(`[data-cp="${ch.id}"]`);
      const price = num(inp.value);
      const out = $('out_'+ch.id);
      if(price <= 0){ out.innerHTML = '<span class="dim">未定價</span>'; return; }
      const svc = price*ch.fee/100 + ch.fixed;
      const tax = TAX.invoice ? price*num(TAX.rate)/100 : 0;
      const profit = price - svc - tax - cost;
      const rate = profit/price*100;
      out.innerHTML =
        (ch.id==='onsite' ? '' : `<span>服務費 <b style="color:#7C3AED">-$${money(svc)}</b></span><span>實收 <b>$${money(price-svc)}</b></span>`) +
        (tax ? `<span>營業稅 <b style="color:#7C3AED">-$${money(tax)}</b></span>` : '') +
        `<span>成本 <b>-$${money(cost)}</b></span>` +
        `<span class="p ${profit<0?'neg':''}">毛利 <b>${profit<0?'-':''}$${money(Math.abs(profit))}</b></span>` +
        `<span>${rateHtml(rate)}</span>`;
    });
  }

  $('compEditor').addEventListener('change', e => {
    const s = e.target.closest('[data-ci]'); if(s){ comps[+s.dataset.ci].itemId = s.value; renderComps(); }
  });
  $('compEditor').addEventListener('input', e => {
    const q = e.target.closest('[data-cq]');
    if(q){
      const i = +q.dataset.cq; comps[i].qty = q.value;
      const it = ITEMS.find(x=>x.id===comps[i].itemId);
      q.closest('.comp-row').querySelector('.sub').textContent = '$' + money(it ? unitCost(it)*num(comps[i].qty) : 0);
      updAll();
    }
  });
  $('compEditor').addEventListener('click', e => {
    if(e.target.id === 'compAdd'){ comps.push({ itemId:'', qty:1 }); renderComps(); return; }
    const rm = e.target.closest('[data-cr]');
    if(rm){ comps.splice(+rm.dataset.cr, 1); if(!comps.length) comps.push({itemId:'',qty:1}); renderComps(); }
  });
  $('chEditor').addEventListener('input', e => { if(e.target.dataset.cp) updAll(); });
  renderComps();

  const close = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target===ov) close(); });
  $('pCancel').addEventListener('click', close);
  $('pSave').addEventListener('click', async () => {
    const name = $('pName').value.trim();
    if(!name) return toast('請填寫商品名稱');
    const clean = comps.filter(c => c.itemId && num(c.qty) > 0)
      .map(c => ({ itemId:c.itemId, name:(ITEMS.find(x=>x.id===c.itemId)?.name)||'', qty:num(c.qty) }));
    if(!clean.length) return toast('請至少選擇一項原料');
    const chPrices = {};
    chs.filter(ch=>ch.id!=='onsite').forEach(ch => {
      const v = num(ov.querySelector(`[data-cp="${ch.id}"]`).value);
      if(v > 0) chPrices[ch.id] = v;
    });
    const data = { store:STORE, name, price:num(ov.querySelector('[data-cp="onsite"]').value),
                   comps:clean, chPrices,
                   note:$('pNote').value.trim(), updatedAt:serverTimestamp() };
    $('pSave').disabled = true;
    try{
      if(isNew){
        data.createdAt = serverTimestamp();
        const ref = await addDoc(collection(db, COLL_PROD), data);
        ALL_PRODS.push({ id:ref.id, ...data });
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'新增商品', detail:`${STORE}／${name}` });
      }else{
        await updateDoc(doc(db, COLL_PROD, p.id), data);
        Object.assign(p, data);
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'編輯商品', detail:`${STORE}／${name}` });
      }
      close(); refresh(); toast(isNew?'已新增商品':'已儲存');
    }catch(e){ console.error(e); toast('儲存失敗：'+(e.message||e)); $('pSave').disabled=false; }
  });
}

async function delProd(id){
  const p = PRODS.find(x=>x.id===id); if(!p) return;
  if(!confirm(`確定刪除商品「${p.name}」？`)) return;
  try{
    await deleteDoc(doc(db, COLL_PROD, id));
    ALL_PRODS = ALL_PRODS.filter(x=>x.id!==id);
    writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'刪除商品', detail:`${STORE}／${p.name}` });
    refresh(); toast('已刪除');
  }catch(e){ console.error(e); toast('刪除失敗：'+(e.message||e)); }
}

// 本地資料變更後重算目前店面視圖
function refresh(){
  ITEMS = ALL_ITEMS.filter(x => sameLoc(x.store, STORE));
  PRODS = ALL_PRODS.filter(x => sameLoc(x.store, STORE));
  PLATS = ALL_PLATS.filter(x => sameLoc(x.store, STORE));
  renderHint(); renderTabs(); renderProds(); renderItems(); renderPlats();
}

/* ═══════════ 匯出 CSV ═══════════ */
function exportCsv(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  let rows = [];
  if(TAB === 'item'){
    rows.push(['店面','名稱','分類','進貨價','可產數量','單位','單位成本','備註']);
    ITEMS.forEach(i => rows.push([STORE, i.name, i.category||'', i.packPrice, i.yieldQty, i.unit||'份', r2(unitCost(i)), i.note||'']));
  }else if(TAB === 'plat'){
    rows.push(['店面','開發票','營業稅率(%)']);
    rows.push([STORE, TAX.invoice?'是':'否', TAX.invoice?TAX.rate:0]);
    rows.push([]);
    rows.push(['店面','平台','服務費(%)','固定費用','備註']);
    PLATS.forEach(p => rows.push([STORE, p.name, p.feePct, p.fixedFee||0, p.note||'']));
  }else{
    const chs = channels();
    rows.push(['店面','商品','成本'].concat(chs.flatMap(ch => [`${ch.name}售價`, `${ch.name}服務費`, `${ch.name}營業稅`, `${ch.name}毛利`, `${ch.name}毛利率(%)`])).concat(['組成明細']));
    PRODS.forEach(p => {
      const c = calcProduct(p);
      const cells = c.chs.flatMap(ch => ch.set ? [r2(ch.price), r2(ch.svc), r2(ch.tax), r2(ch.profit), ch.rate.toFixed(1)] : ['','','','','']);
      rows.push([STORE, p.name, r2(c.cost)].concat(cells)
        .concat([c.rows.map(r=>`${r.name}x${r.qty}=$${r2(r.sub)}`).join(' + ')]));
    });
  }
  const csv = '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = `成本利潤_${STORE}_${TAB==='item'?'原料':(TAB==='plat'?'平台':'商品')}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已匯出 CSV');
}
</script>
