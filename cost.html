<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成本利潤 — 鑫系統</title>
<style>
:root{
  --bg:#ECEEF2;--surface:#fff;--surface2:#F4F5F8;--border:#DDE1E9;--border2:#C8CDD8;
  --text:#1A1D23;--text2:#5A6175;--text3:#9AA0B4;--accent:#2D3142;--accent-light:#F0F2F5;
  --ok:#1F9D55;--warn:#D98A00;--danger:#C0392B;--info:#2D6CDF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ── Topbar ── */
.topbar{height:60px;background:var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:200;gap:10px}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1;overflow:hidden}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.back-btn{font-size:12px;padding:0 13px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.2);font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0;min-height:44px;display:flex;align-items:center}
.back-btn:hover{background:rgba(255,255,255,.2)}
.tb-dv{width:1px;height:20px;background:rgba(255,255,255,.2);flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.role-chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);white-space:nowrap;flex-shrink:0}

/* ── Main ── */
.main{max-width:1040px;margin:0 auto;padding:24px 20px}
.hint{font-size:12px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:16px;line-height:1.6}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{font-size:13px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:38px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .cnt{font-size:11px;background:rgba(0,0,0,.08);padding:0 7px;border-radius:10px;min-width:18px;text-align:center}
.tab.active .cnt{background:rgba(255,255,255,.22)}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-card .n{font-size:24px;font-weight:800;line-height:1.1;word-break:break-all}
.stat-card .l{font-size:12px;color:var(--text2);margin-top:6px}
.stat-card.s-a .n{color:var(--info)}
.stat-card.s-b .n{color:var(--ok)}
.stat-card.s-c .n{color:var(--warn)}
.stat-card.s-d .n{color:var(--danger)}

/* ── Toolbar / Buttons ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;min-height:44px}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:var(--accent)}
.grow{flex:1;min-width:150px}
.btn{font-size:13px;padding:0 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);min-height:44px;white-space:nowrap}
.btn:hover{background:var(--accent-light);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#3D4158}
.btn-danger{background:#FEECEB;color:#C0392B;border-color:#FCA5A5}
.btn-sm{font-size:12px;padding:0 11px;min-height:36px}
.ml-auto{margin-left:auto}

/* ── 原料卡 ── */
.ilist{display:flex;flex-direction:column;gap:10px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-left:4px solid var(--info)}
.item-card.c-耗材{border-left-color:var(--warn)}
.ic-main{flex:1;min-width:0}
.ic-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ic-formula{font-size:12px;color:var(--text2);margin-top:4px}
.ic-cost{text-align:right;flex-shrink:0}
.ic-cost .v{font-size:20px;font-weight:800;color:var(--accent);line-height:1}
.ic-cost .u{font-size:11px;color:var(--text3);margin-top:3px}
.ic-act{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.icon-btn:hover{background:var(--accent-light);color:var(--text)}
.badge{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.b-食材{background:#E5EEFB;color:var(--info)}
.b-耗材{background:#FFF1DC;color:var(--warn)}
.b-warn{background:#FCE9E7;color:var(--danger)}

/* ── 商品卡 ── */
.plist{display:flex;flex-direction:column;gap:12px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;border-left:4px solid var(--ok)}
.prod-card.lv-mid{border-left-color:var(--info)}
.prod-card.lv-low{border-left-color:var(--warn)}
.prod-card.lv-bad{border-left-color:var(--danger)}
.pc-head{padding:15px 16px;cursor:pointer}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-name{font-size:16px;font-weight:700;line-height:1.3}
.pc-rate{text-align:right;flex-shrink:0}
.pc-rate .v{font-size:22px;font-weight:800;line-height:1}
.pc-rate .l{font-size:10.5px;color:var(--text3);margin-top:2px}
.lv-good .pc-rate .v{color:var(--ok)} .lv-mid .pc-rate .v{color:var(--info)}
.lv-low .pc-rate .v{color:var(--warn)} .lv-bad .pc-rate .v{color:var(--danger)}
.pc-nums{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text2)}
.pc-nums b{font-size:15px;color:var(--text);font-weight:800;margin-left:4px}
.pc-nums .profit b{color:var(--ok)} .pc-nums .profit.neg b{color:var(--danger)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-top:12px}
.bar .seg-cost{background:linear-gradient(90deg,#8892A6,#5A6175)}
.bar .seg-profit{background:linear-gradient(90deg,#35C07A,#1F9D55)}
.bar .seg-loss{background:repeating-linear-gradient(45deg,#E88,#E88 5px,#C0392B 5px,#C0392B 10px)}
.bar-legend{display:flex;gap:14px;font-size:10.5px;color:var(--text3);margin-top:6px}
.bar-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.pc-body{border-top:1px solid var(--border);padding:14px 16px;background:var(--surface2);display:none}
.pc-body.open{display:block}
.comp-tb{width:100%;border-collapse:collapse;font-size:13px}
.comp-tb th{text-align:left;font-size:11px;color:var(--text2);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border)}
.comp-tb td{padding:8px;border-bottom:1px solid var(--border)}
.comp-tb tr:last-child td{border-bottom:none}
.comp-tb .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.comp-tb tfoot td{font-weight:800;border-top:2px solid var(--border2)}
.miss{color:var(--danger);font-size:11px}
.pc-actions{display:flex;gap:8px;margin-top:14px}
.pc-actions .btn{flex:1;justify-content:center}
.empty{text-align:center;padding:48px 16px;color:var(--text3);font-size:14px;line-height:1.8}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:500;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:600px;padding:24px 20px 32px;box-shadow:0 -8px 40px rgba(0,0,0,.15);max-height:92vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;min-height:44px}
.form-row textarea{min-height:64px;resize:vertical}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--accent)}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.req::after{content:' *';color:var(--danger)}
.modal-footer{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.modal-footer .btn{flex:1;justify-content:center}
.calc-preview{background:var(--accent-light);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-top:-4px;margin-bottom:14px}
.calc-preview .v{font-size:20px;font-weight:800;color:var(--accent)}

/* ── 組成編輯器 ── */
.comp-editor{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.comp-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.comp-row:last-child{border-bottom:none}
.comp-row select{flex:1;min-width:0;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;background:var(--surface);color:var(--text);min-height:40px}
.comp-row input.qty{width:66px;font-size:13px;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;text-align:center;min-height:40px}
.comp-row .sub{width:74px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.comp-row .rm{width:34px;height:34px;flex-shrink:0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;font-size:15px}
.comp-row .rm:hover{background:#FEECEB;color:var(--danger);border-color:#FCA5A5}
.comp-add{padding:9px 10px;background:var(--surface2)}
.summary-box{background:var(--accent);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sb-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0}
.sb-row.big{font-size:14px;font-weight:700;border-top:1px solid rgba(255,255,255,.2);margin-top:7px;padding-top:9px}
.sb-row .v{font-size:19px;font-weight:800}
.sb-row.big .v.pos{color:#6EE7A8} .sb-row.big .v.neg{color:#FFA79E}

/* ── Toast / Loading ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1D23;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;visibility:hidden;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;visibility:visible}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;gap:8px;font-size:13px;color:var(--text3)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* ── RWD ── */
@media(max-width:600px){
  .topbar{padding:0 12px;gap:6px;height:52px}
  .topbar h1{font-size:13px}
  .back-btn{font-size:11px;padding:0 10px;min-height:36px}
  .role-chip{font-size:10px;padding:2px 8px}
  #btnNew .btn-label{display:none}
  #btnNew{padding:0 11px;min-width:36px;justify-content:center}
  .main{padding:12px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:13px}
  .stat-card .n{font-size:20px}
  .toolbar select,.toolbar input{width:100%}
  .form-3{grid-template-columns:1fr 1fr}
  .item-card{flex-wrap:wrap;gap:10px}
  .ic-main{flex:1 1 60%}
  .ic-act{margin-left:auto}
  .comp-row{flex-wrap:wrap}
  .comp-row select{flex:1 1 100%}
  .modal{border-radius:16px 16px 0 0;max-height:92vh}
}
@media(min-width:601px){
  .overlay{align-items:center;padding:16px}
  .modal{border-radius:16px;max-height:88vh}
}
/* ── embed 隱藏 topbar（iframe 模式必加）── */
[data-embed="1"] .topbar,[data-embed="1"] .topbar *{display:none!important;height:0!important;min-height:0!important;overflow:hidden!important}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>載入中…</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="btnBack">← 主選單</button>
      <div class="tb-dv"></div>
      <h1>🧮 成本利潤</h1>
    </div>
    <div class="topbar-right">
      <button class="btn" id="btnCsv">匯出CSV</button>
      <button class="btn btn-primary" id="btnNew">＋<span class="btn-label"> 新增</span></button>
      <span class="role-chip" id="roleChip">—</span>
    </div>
  </div>

  <div class="main">
    <div class="hint">
      🧮 先在「<b>原料成本</b>」建立每項食材／耗材的<b>進貨價 ÷ 可產份數</b>，系統自動算出單份成本；
      再到「<b>商品定價</b>」把原料組合成商品並填入售價，即可看到總成本、毛利與毛利率。
      原料進貨價一改，<b>所有用到它的商品成本會自動跟著更新</b>。
    </div>

    <div class="tabs" id="tabs"></div>

    <!-- ══ 商品定價 ══ -->
    <div id="viewProd">
      <div class="stats">
        <div class="stat-card s-a"><div class="n" id="stCount">0</div><div class="l">商品數</div></div>
        <div class="stat-card s-b"><div class="n" id="stAvg">—</div><div class="l">平均毛利率</div></div>
        <div class="stat-card s-c"><div class="n" id="stLow">—</div><div class="l">最低毛利率商品</div></div>
        <div class="stat-card s-d"><div class="n" id="stBad">0</div><div class="l">🔴 虧損／未定價</div></div>
      </div>
      <div class="toolbar">
        <input type="text" id="fpSearch" class="grow" placeholder="🔍 搜尋商品名稱…">
        <select id="fpSort">
          <option value="rate_asc">毛利率 低→高</option>
          <option value="rate_desc">毛利率 高→低</option>
          <option value="profit_desc">毛利額 高→低</option>
          <option value="name">名稱排序</option>
        </select>
      </div>
      <div class="plist" id="plist"></div>
    </div>

    <!-- ══ 原料成本 ══ -->
    <div id="viewItem" style="display:none">
      <div class="toolbar">
        <input type="text" id="fiSearch" class="grow" placeholder="🔍 搜尋原料名稱…">
        <select id="fiCat">
          <option value="__all__">全部分類</option>
          <option value="食材">🥬 食材</option>
          <option value="耗材">📦 耗材</option>
        </select>
      </div>
      <div class="ilist" id="ilist"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { authGuard, db, writeOpLog } from './auth-guard.js?v=2';
import { collection, getDocs, doc, addDoc, updateDoc, deleteDoc, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ─────────── 設定 ─────────── */
const COLL_ITEM = 'cost_items';      // 原料／耗材
const COLL_PROD = 'cost_products';   // 商品
const FETCH_LIMIT = 800;
const EDIT_ROLES = ['admin','consultant'];   // 可編輯的角色（其餘為唯讀）
const CATS = ['食材','耗材'];
const UNITS = ['份','個','杯','包','片','組'];

const CUR = { role:'', name:'—', uid:'' };
let ITEMS = [];      // {id,name,category,packPrice,yieldQty,unit,note}
let PRODS = [];      // {id,name,price,comps:[{itemId,name,qty}],note}
let TAB = 'prod';
let canEdit = false;

/* ─────────── 小工具 ─────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2  = n => Math.round(n*100)/100;
const money = n => (Math.round(n*100)/100).toLocaleString('zh-TW',{minimumFractionDigits:0,maximumFractionDigits:2});

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

// 單份成本：進貨價 ÷ 可產份數
function unitCost(it){
  const q = num(it.yieldQty);
  return q > 0 ? num(it.packPrice)/q : 0;
}

// 商品成本試算（即時對照目前原料價）
function calcProduct(p){
  const rows = (p.comps||[]).map(c => {
    const it = ITEMS.find(x => x.id === c.itemId);
    const uc = it ? unitCost(it) : 0;
    const qty = num(c.qty) || 0;
    return { name: it ? it.name : (c.name || '（原料已刪除）'), missing: !it,
             unit: it ? (it.unit||'份') : '份', uc, qty, sub: uc*qty };
  });
  const cost   = rows.reduce((s,r)=>s+r.sub, 0);
  const price  = num(p.price);
  const profit = price - cost;
  const rate   = price > 0 ? (profit/price*100) : null;   // 毛利率＝毛利÷售價
  return { rows, cost, price, profit, rate, hasMissing: rows.some(r=>r.missing) };
}

function lvOf(rate){
  if(rate === null || rate < 0) return 'bad';
  if(rate < 20) return 'low';
  if(rate < 45) return 'mid';
  return 'good';
}

/* ─────────── 進場 ─────────── */
authGuard('cost', ({ uid, role, userData }) => {
  CUR.role = role; CUR.uid = uid; CUR.name = userData?.name || '—';
  canEdit = EDIT_ROLES.includes(role);
  const rc = $('roleChip');
  if(rc) rc.textContent = ({admin:'管理員',consultant:'顧問',manager:'店長/副店長',employee:'同仁'})[role] || role || '—';
  init();
});

async function init(){
  $('btnBack').addEventListener('click', () => {
    if(window.self !== window.top){ window.parent.postMessage({type:'navigate',page:'dashboard.html'},'*'); }
    else { window.location.href = 'dashboard.html'; }
  });
  if(!canEdit) $('btnNew').style.display = 'none';
  $('btnNew').addEventListener('click', () => TAB==='prod' ? openProdModal(null) : openItemModal(null));
  $('btnCsv').addEventListener('click', exportCsv);
  $('fpSearch').addEventListener('input', renderProds);
  $('fpSort').addEventListener('change', renderProds);
  $('fiSearch').addEventListener('input', renderItems);
  $('fiCat').addEventListener('change', renderItems);

  await loadAll();
  $('loading').style.display = 'none';
  $('app').style.display = '';
  renderTabs(); renderProds(); renderItems();
}

async function loadAll(){
  try{
    // 4-2③ 獨立讀取一律並行
    const [si, sp] = await Promise.all([
      getDocs(query(collection(db, COLL_ITEM), orderBy('name'), limit(FETCH_LIMIT))),
      getDocs(query(collection(db, COLL_PROD), orderBy('name'), limit(FETCH_LIMIT)))
    ]);
    ITEMS = si.docs.map(d => ({ id:d.id, ...d.data() }));
    PRODS = sp.docs.map(d => ({ id:d.id, ...d.data() }));
  }catch(e){
    console.error(e); toast('讀取失敗：' + (e.message||e));
    ITEMS = []; PRODS = [];
  }
}

/* ─────────── Tabs ─────────── */
function renderTabs(){
  $('tabs').innerHTML =
    `<div class="tab ${TAB==='prod'?'active':''}" data-tab="prod">🍚 商品定價 <span class="cnt">${PRODS.length}</span></div>` +
    `<div class="tab ${TAB==='item'?'active':''}" data-tab="item">🧾 原料成本 <span class="cnt">${ITEMS.length}</span></div>`;
}
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(!t) return;
  TAB = t.dataset.tab;
  $('viewProd').style.display = TAB==='prod' ? '' : 'none';
  $('viewItem').style.display = TAB==='item' ? '' : 'none';
  $('btnNew').querySelector('.btn-label').textContent = TAB==='prod' ? ' 新增商品' : ' 新增原料';
  renderTabs();
});

/* ─────────── 原料清單 ─────────── */
function renderItems(){
  const kw  = $('fiSearch').value.trim().toLowerCase();
  const cat = $('fiCat').value;
  const list = ITEMS
    .filter(i => cat==='__all__' || i.category===cat)
    .filter(i => !kw || String(i.name||'').toLowerCase().includes(kw));

  if(!list.length){
    $('ilist').innerHTML = `<div class="empty">${ITEMS.length ? '沒有符合條件的原料' : '尚未建立原料<br>點右上「＋ 新增原料」開始，例如：米 100 元 可產 20 份'}</div>`;
    return;
  }
  $('ilist').innerHTML = list.map(i => {
    const uc = unitCost(i), u = i.unit || '份';
    const used = PRODS.filter(p => (p.comps||[]).some(c => c.itemId === i.id)).length;
    return `<div class="item-card c-${esc(i.category||'食材')}">
      <div class="ic-main">
        <div class="ic-name">${esc(i.name)}<span class="badge b-${esc(i.category||'食材')}">${esc(i.category||'食材')}</span>${used?`<span class="badge b-食材" style="background:var(--surface2);color:var(--text2)">用於 ${used} 項商品</span>`:''}</div>
        <div class="ic-formula">$${money(i.packPrice)} ÷ ${money(i.yieldQty)} ${esc(u)}${i.note?` · ${esc(i.note)}`:''}</div>
      </div>
      <div class="ic-cost"><div class="v">$${money(uc)}</div><div class="u">每 1 ${esc(u)}</div></div>
      ${canEdit ? `<div class="ic-act">
        <button class="icon-btn" data-iedit="${i.id}" title="編輯">✏️</button>
        <button class="icon-btn" data-idel="${i.id}" title="刪除">🗑</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

$('ilist').addEventListener('click', e => {
  const ed = e.target.closest('[data-iedit]'); if(ed) return openItemModal(ITEMS.find(x=>x.id===ed.dataset.iedit));
  const dl = e.target.closest('[data-idel]');  if(dl) return delItem(dl.dataset.idel);
});

/* ─────────── 商品清單 ─────────── */
function renderProds(){
  const kw   = $('fpSearch').value.trim().toLowerCase();
  const sort = $('fpSort').value;

  const calced = PRODS.map(p => ({ p, c: calcProduct(p) }));

  // 統計
  const valid = calced.filter(x => x.c.rate !== null);
  const avg   = valid.length ? valid.reduce((s,x)=>s+x.c.rate,0)/valid.length : null;
  const low   = valid.length ? valid.reduce((m,x)=> x.c.rate < m.c.rate ? x : m) : null;
  const bad   = calced.filter(x => x.c.rate === null || x.c.profit < 0).length;
  $('stCount').textContent = PRODS.length;
  $('stAvg').textContent   = avg===null ? '—' : avg.toFixed(1)+'%';
  $('stLow').textContent   = low ? `${low.p.name}` : '—';
  $('stLow').style.fontSize = '15px';
  $('stBad').textContent   = bad;

  let list = calced.filter(x => !kw || String(x.p.name||'').toLowerCase().includes(kw));
  const rk = x => x.c.rate === null ? -9999 : x.c.rate;
  if(sort==='rate_asc')        list.sort((a,b)=> rk(a)-rk(b));
  else if(sort==='rate_desc')  list.sort((a,b)=> rk(b)-rk(a));
  else if(sort==='profit_desc')list.sort((a,b)=> b.c.profit-a.c.profit);
  else list.sort((a,b)=> String(a.p.name).localeCompare(String(b.p.name),'zh-Hant'));

  if(!list.length){
    $('plist').innerHTML = `<div class="empty">${PRODS.length ? '沒有符合條件的商品' : '尚未建立商品<br>點右上「＋ 新增」，把原料組合成商品並填入售價'}</div>`;
    return;
  }

  $('plist').innerHTML = list.map(({p,c}) => {
    const lv = lvOf(c.rate);
    const total = Math.max(c.price, c.cost) || 1;
    const costPct = Math.min(100, c.cost/total*100);
    const bar = c.profit >= 0
      ? `<div class="seg-cost" style="width:${costPct}%"></div><div class="seg-profit" style="width:${100-costPct}%"></div>`
      : `<div class="seg-loss" style="width:100%"></div>`;
    return `<div class="prod-card lv-${lv}" data-pid="${p.id}">
      <div class="pc-head" data-toggle="${p.id}">
        <div class="pc-top">
          <div style="min-width:0">
            <div class="pc-name">${esc(p.name)}${c.hasMissing?' <span class="badge b-warn">原料缺失</span>':''}</div>
            <div class="pc-nums">
              <span>售價<b>$${money(c.price)}</b></span>
              <span>成本<b>$${money(c.cost)}</b></span>
              <span class="profit ${c.profit<0?'neg':''}">毛利<b>${c.profit<0?'-':''}$${money(Math.abs(c.profit))}</b></span>
            </div>
          </div>
          <div class="pc-rate"><div class="v">${c.rate===null?'—':c.rate.toFixed(1)+'%'}</div><div class="l">毛利率</div></div>
        </div>
        <div class="bar">${bar}</div>
        <div class="bar-legend">
          <span><i style="background:#5A6175"></i>成本 ${c.price>0?(c.cost/c.price*100).toFixed(0)+'% 成本率':''}</span>
          <span><i style="background:${c.profit<0?'#C0392B':'#1F9D55'}"></i>${c.profit<0?'虧損':'毛利'}</span>
          <span style="margin-left:auto">展開明細 ▾</span>
        </div>
      </div>
      <div class="pc-body" id="body_${p.id}">
        <table class="comp-tb">
          <thead><tr><th>組成</th><th class="num">單位成本</th><th class="num">數量</th><th class="num">小計</th></tr></thead>
          <tbody>${c.rows.length ? c.rows.map(r=>`<tr>
            <td>${esc(r.name)}${r.missing?' <span class="miss">✕ 已刪除</span>':''}</td>
            <td class="num">$${money(r.uc)}</td>
            <td class="num">${money(r.qty)} ${esc(r.unit)}</td>
            <td class="num">$${money(r.sub)}</td></tr>`).join('')
            : '<tr><td colspan="4" style="color:var(--text3)">尚未設定組成</td></tr>'}
          </tbody>
          <tfoot>
            <tr><td>總成本</td><td></td><td></td><td class="num">$${money(c.cost)}</td></tr>
            <tr><td>售價</td><td></td><td></td><td class="num">$${money(c.price)}</td></tr>
            <tr><td style="color:${c.profit<0?'var(--danger)':'var(--ok)'}">單份毛利</td><td></td><td></td>
                <td class="num" style="color:${c.profit<0?'var(--danger)':'var(--ok)'}">${c.profit<0?'-':''}$${money(Math.abs(c.profit))}</td></tr>
          </tfoot>
        </table>
        ${p.note?`<div style="font-size:12px;color:var(--text2);margin-top:10px">📝 ${esc(p.note)}</div>`:''}
        ${canEdit?`<div class="pc-actions">
          <button class="btn btn-sm" data-pedit="${p.id}">✏️ 編輯</button>
          <button class="btn btn-sm btn-danger" data-pdel="${p.id}">🗑 刪除</button>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

$('plist').addEventListener('click', e => {
  const ed = e.target.closest('[data-pedit]'); if(ed){ e.stopPropagation(); return openProdModal(PRODS.find(x=>x.id===ed.dataset.pedit)); }
  const dl = e.target.closest('[data-pdel]');  if(dl){ e.stopPropagation(); return delProd(dl.dataset.pdel); }
  const tg = e.target.closest('[data-toggle]'); if(tg){ const b = $('body_'+tg.dataset.toggle); if(b) b.classList.toggle('open'); }
});

/* ─────────── 原料 Modal ─────────── */
function openItemModal(it){
  const isNew = !it;
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-title">🧾 ${isNew?'新增':'編輯'}原料／耗材</div>
    <div class="form-row"><label class="req">名稱</label>
      <input type="text" id="iName" placeholder="例：米、雞肉、外帶碗" value="${esc(it?.name||'')}"></div>
    <div class="form-3">
      <div class="form-row"><label>分類</label><select id="iCat">
        ${CATS.map(c=>`<option value="${c}" ${it?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-row"><label class="req">進貨價</label>
        <input type="number" id="iPrice" inputmode="decimal" step="0.01" min="0" placeholder="100" value="${it?.packPrice??''}"></div>
      <div class="form-row"><label class="req">可產數量</label>
        <input type="number" id="iQty" inputmode="decimal" step="0.01" min="0" placeholder="20" value="${it?.yieldQty??''}"></div>
    </div>
    <div class="form-row"><label>單位</label><select id="iUnit">
      ${UNITS.map(u=>`<option value="${u}" ${(it?.unit||'份')===u?'selected':''}>${u}</option>`).join('')}</select></div>
    <div class="calc-preview"><span>單位成本</span><span class="v" id="iPreview">$0</span></div>
    <div class="form-row"><label>備註</label><input type="text" id="iNote" placeholder="廠商、規格…" value="${esc(it?.note||'')}"></div>
    <div class="modal-footer">
      <button class="btn" id="iCancel">取消</button>
      <button class="btn btn-primary" id="iSave">${isNew?'新增':'儲存'}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const upd = () => {
    const p = num($('iPrice').value), q = num($('iQty').value);
    $('iPreview').textContent = q>0 ? `$${money(p/q)} / ${$('iUnit').value}` : '—';
  };
  ['iPrice','iQty','iUnit'].forEach(id => $(id).addEventListener('input', upd));
  $('iUnit').addEventListener('change', upd);
  upd();

  const close = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target === ov) close(); });
  $('iCancel').addEventListener('click', close);
  $('iSave').addEventListener('click', async () => {
    const name = $('iName').value.trim();
    const packPrice = num($('iPrice').value), yieldQty = num($('iQty').value);
    if(!name) return toast('請填寫名稱');
    if(packPrice <= 0) return toast('進貨價需大於 0');
    if(yieldQty <= 0) return toast('可產數量需大於 0');
    const data = { name, category:$('iCat').value, packPrice, yieldQty,
                   unit:$('iUnit').value, note:$('iNote').value.trim(), updatedAt: serverTimestamp() };
    $('iSave').disabled = true;
    try{
      if(isNew){
        data.createdAt = serverTimestamp();
        const ref = await addDoc(collection(db, COLL_ITEM), data);
        ITEMS.push({ id:ref.id, ...data });
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'新增原料', detail:name });
      }else{
        await updateDoc(doc(db, COLL_ITEM, it.id), data);
        Object.assign(it, data);
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'編輯原料', detail:name });
      }
      ITEMS.sort((a,b)=> String(a.name).localeCompare(String(b.name),'zh-Hant'));
      close(); renderTabs(); renderItems(); renderProds();
      toast(isNew ? '已新增原料' : '已儲存');
    }catch(e){ console.error(e); toast('儲存失敗：'+(e.message||e)); $('iSave').disabled = false; }
  });
}

async function delItem(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  const used = PRODS.filter(p => (p.comps||[]).some(c => c.itemId === id));
  const warn = used.length ? `\n\n⚠️ 目前有 ${used.length} 項商品使用此原料（${used.slice(0,3).map(p=>p.name).join('、')}${used.length>3?'…':''}），刪除後這些商品的成本會少算。` : '';
  if(!confirm(`確定刪除原料「${it.name}」？${warn}`)) return;
  try{
    await deleteDoc(doc(db, COLL_ITEM, id));
    ITEMS = ITEMS.filter(x=>x.id!==id);
    writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'刪除原料', detail:it.name });
    renderTabs(); renderItems(); renderProds(); toast('已刪除');
  }catch(e){ console.error(e); toast('刪除失敗：'+(e.message||e)); }
}

/* ─────────── 商品 Modal ─────────── */
function openProdModal(p){
  const isNew = !p;
  if(!ITEMS.length){ toast('請先到「原料成本」建立原料'); return; }
  let comps = (p?.comps||[]).map(c => ({ itemId:c.itemId, qty:num(c.qty)||1 }));
  if(!comps.length) comps = [{ itemId:'', qty:1 }];

  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-title">🍚 ${isNew?'新增':'編輯'}商品</div>
    <div class="form-2">
      <div class="form-row"><label class="req">商品名稱</label>
        <input type="text" id="pName" placeholder="例：雞肉飯" value="${esc(p?.name||'')}"></div>
      <div class="form-row"><label class="req">售價</label>
        <input type="number" id="pPrice" inputmode="decimal" step="0.5" min="0" placeholder="80" value="${p?.price??''}"></div>
    </div>
    <div class="form-row" style="margin-bottom:6px"><label>組成（食材＋耗材）</label></div>
    <div class="comp-editor" id="compEditor"></div>
    <div class="summary-box">
      <div class="sb-row"><span>總成本</span><span class="v" id="sbCost">$0</span></div>
      <div class="sb-row"><span>售價</span><span class="v" id="sbPrice">$0</span></div>
      <div class="sb-row big"><span>毛利 / 毛利率</span><span class="v" id="sbProfit">$0（—）</span></div>
    </div>
    <div class="form-row"><label>備註</label><input type="text" id="pNote" placeholder="口味、份量說明…" value="${esc(p?.note||'')}"></div>
    <div class="modal-footer">
      <button class="btn" id="pCancel">取消</button>
      <button class="btn btn-primary" id="pSave">${isNew?'新增':'儲存'}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const optHtml = sel => '<option value="">— 選擇原料 —</option>' + ITEMS.map(i =>
    `<option value="${i.id}" ${sel===i.id?'selected':''}>${esc(i.name)}（$${money(unitCost(i))}/${esc(i.unit||'份')}）</option>`).join('');

  function renderComps(){
    $('compEditor').innerHTML = comps.map((c,idx) => {
      const it = ITEMS.find(x=>x.id===c.itemId);
      const sub = it ? unitCost(it)*num(c.qty) : 0;
      return `<div class="comp-row">
        <select data-ci="${idx}">${optHtml(c.itemId)}</select>
        <input class="qty" type="number" inputmode="decimal" step="0.1" min="0" data-cq="${idx}" value="${c.qty}">
        <span class="sub">$${money(sub)}</span>
        <button class="rm" data-cr="${idx}" title="移除">✕</button>
      </div>`;
    }).join('') + `<div class="comp-add"><button class="btn btn-sm" id="compAdd" style="width:100%;justify-content:center">＋ 增加一項原料</button></div>`;
    updSummary();
  }
  function updSummary(){
    const cost = comps.reduce((s,c) => {
      const it = ITEMS.find(x=>x.id===c.itemId);
      return s + (it ? unitCost(it)*num(c.qty) : 0);
    }, 0);
    const price = num($('pPrice').value);
    const profit = price - cost;
    const rate = price > 0 ? profit/price*100 : null;
    $('sbCost').textContent  = '$' + money(cost);
    $('sbPrice').textContent = '$' + money(price);
    const el = $('sbProfit');
    el.textContent = `${profit<0?'-':''}$${money(Math.abs(profit))}（${rate===null?'—':rate.toFixed(1)+'%'}）`;
    el.className = 'v ' + (profit < 0 ? 'neg' : 'pos');
  }

  $('compEditor').addEventListener('change', e => {
    const s = e.target.closest('[data-ci]'); if(s){ comps[+s.dataset.ci].itemId = s.value; renderComps(); }
  });
  $('compEditor').addEventListener('input', e => {
    const q = e.target.closest('[data-cq]');
    if(q){ comps[+q.dataset.cq].qty = q.value; 
           const row = q.closest('.comp-row'); const c = comps[+q.dataset.cq];
           const it = ITEMS.find(x=>x.id===c.itemId);
           row.querySelector('.sub').textContent = '$' + money(it ? unitCost(it)*num(c.qty) : 0);
           updSummary(); }
  });
  $('compEditor').addEventListener('click', e => {
    if(e.target.id === 'compAdd'){ comps.push({ itemId:'', qty:1 }); renderComps(); return; }
    const rm = e.target.closest('[data-cr]');
    if(rm){ comps.splice(+rm.dataset.cr, 1); if(!comps.length) comps.push({itemId:'',qty:1}); renderComps(); }
  });
  $('pPrice').addEventListener('input', updSummary);
  renderComps();

  const close = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target === ov) close(); });
  $('pCancel').addEventListener('click', close);
  $('pSave').addEventListener('click', async () => {
    const name = $('pName').value.trim();
    if(!name) return toast('請填寫商品名稱');
    const clean = comps.filter(c => c.itemId && num(c.qty) > 0)
      .map(c => ({ itemId:c.itemId, name:(ITEMS.find(x=>x.id===c.itemId)?.name)||'', qty:num(c.qty) }));
    if(!clean.length) return toast('請至少選擇一項原料');
    const data = { name, price:num($('pPrice').value), comps:clean,
                   note:$('pNote').value.trim(), updatedAt: serverTimestamp() };
    $('pSave').disabled = true;
    try{
      if(isNew){
        data.createdAt = serverTimestamp();
        const ref = await addDoc(collection(db, COLL_PROD), data);
        PRODS.push({ id:ref.id, ...data });
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'新增商品', detail:name });
      }else{
        await updateDoc(doc(db, COLL_PROD, p.id), data);
        Object.assign(p, data);
        writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'編輯商品', detail:name });
      }
      close(); renderTabs(); renderProds();
      toast(isNew ? '已新增商品' : '已儲存');
    }catch(e){ console.error(e); toast('儲存失敗：'+(e.message||e)); $('pSave').disabled = false; }
  });
}

async function delProd(id){
  const p = PRODS.find(x=>x.id===id); if(!p) return;
  if(!confirm(`確定刪除商品「${p.name}」？`)) return;
  try{
    await deleteDoc(doc(db, COLL_PROD, id));
    PRODS = PRODS.filter(x=>x.id!==id);
    writeOpLog({ editor:CUR.name, role:CUR.role, module:'cost', action:'刪除商品', detail:p.name });
    renderTabs(); renderProds(); renderItems(); toast('已刪除');
  }catch(e){ console.error(e); toast('刪除失敗：'+(e.message||e)); }
}

/* ─────────── 匯出 CSV ─────────── */
function exportCsv(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  let rows = [];
  if(TAB === 'item'){
    rows.push(['名稱','分類','進貨價','可產數量','單位','單位成本','備註']);
    ITEMS.forEach(i => rows.push([i.name, i.category||'', i.packPrice, i.yieldQty, i.unit||'份', r2(unitCost(i)), i.note||'']));
  }else{
    rows.push(['商品','售價','總成本','毛利','毛利率(%)','成本率(%)','組成明細']);
    PRODS.forEach(p => {
      const c = calcProduct(p);
      const detail = c.rows.map(r => `${r.name}x${r.qty}=$${r2(r.sub)}`).join(' + ');
      rows.push([p.name, r2(c.price), r2(c.cost), r2(c.profit),
                 c.rate===null?'':c.rate.toFixed(1), c.price>0?(c.cost/c.price*100).toFixed(1):'', detail]);
    });
  }
  const csv = '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  const a = document.createElement('a');
  a.href = url; a.download = `成本利潤_${TAB==='item'?'原料':'商品'}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已匯出 CSV');
}
</script>
