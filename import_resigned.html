<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>歷史離職名單匯入（一次性工具）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#ECEEF2;--surface:#fff;--border:#DDE1E9;--border2:#C8CDD8;--text:#1A1D23;--text2:#5A6175;--text3:#9AA0B4;--accent:#2D3142}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding:24px}
.wrap{max-width:1000px;margin:0 auto}
.card{background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:22px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:19px}
.sub{color:var(--text2);font-size:13px;margin-bottom:18px}
.box{border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:14px;line-height:1.7}
.warn{background:#FFF7ED;border:1px solid #FDBA74;color:#C2410C}
.info{background:#EFF6FF;border:1px solid #93C5FD;color:#1D4ED8}
.ok{background:#F0FDF4;border:1px solid #86EFAC;color:#15803D}
.err{background:#FEF2F2;border:1px solid #FCA5A5;color:#B91C1C}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sc{background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.sl{font-size:11px;color:var(--text2);margin-bottom:4px}
.sn{font-size:22px;font-weight:700}
button{padding:10px 20px;border-radius:8px;border:1px solid var(--border2);background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:8px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-danger{background:#DC2626;color:#fff;border-color:#DC2626}
button:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
th{background:#F1F5F9;padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #F1F5F9}
.tw{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600}
.t-new{background:#DCFCE7;color:#15803D}
.t-skip{background:#F1F5F9;color:var(--text2)}
.t-nobd{background:#FEF3C7;color:#92400E}
#log{font-size:12px;background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;white-space:pre-wrap;max-height:220px;overflow:auto}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}body{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>📥 歷史離職名單匯入</h2>
    <div class="sub">系統建立前的離職人員名單，一次性寫入「離職同仁」做紀錄。僅限管理員執行。</div>

    <div class="box warn">
      <b>匯入設定</b><br>
      • 職稱一律「正職同仁」、狀態「離職」<br>
      • 到職日／離職日<b>留空</b>（畫面會顯示「—」）<br>
      • <b>不匯入電話</b>：依你先前的個資規範，離職同仁不保留電話欄位<br>
      • 匯入身分證號（不顯示於畫面，僅供日後比對用）<br>
      • <b>不會建立 Firebase 登入帳號</b>
    </div>

    <div class="box info">
      執行前系統會自動建立一份「<b>匯入前快照</b>」到備份管理，若結果不如預期可直接還原回去。
    </div>

    <div id="status" class="box info">確認登入權限中…</div>

    <div id="panel" style="display:none">
      <div class="stats">
        <div class="sc"><div class="sl">檔案筆數</div><div class="sn" id="stTotal">0</div></div>
        <div class="sc"><div class="sl">將新增</div><div class="sn" id="stNew" style="color:#15803D">0</div></div>
        <div class="sc"><div class="sl">已存在跳過</div><div class="sn" id="stSkip" style="color:var(--text2)">0</div></div>
        <div class="sc"><div class="sl">生日待補</div><div class="sn" id="stNoBd" style="color:#B45309">0</div></div>
      </div>
      <button class="btn-primary" id="btnScan" onclick="scan()">🔍 比對現有資料</button>
      <button class="btn-danger" id="btnRun" onclick="run()" disabled>✓ 執行匯入</button>
      <div id="preview"></div>
      <div id="log"></div>
    </div>
  </div>
</div>

let curResigned = [], curEmployees = [], toImport = [], me = '';

const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; $('log').scrollTop = 1e9; };
const setStatus = (m, cls) => { const e = $('status'); e.className = 'box ' + cls; e.innerHTML = m; };

// 店名正規化：處理 舖/鋪 異體字與空白
const normLoc = s => (s||'').replace(/\s/g,'').replace(/鋪/g,'舖');

authGuard('hr', async ({ role, userData }) => {
  me = userData?.name || userData?.idNo || 'Unknown';
  if (role !== 'admin') {
    setStatus('❌ 此工具僅限<b>管理員</b>使用（目前角色：' + role + '）', 'err');
    return;
  }
  setStatus('✅ 管理員身分確認：<b>' + me + '</b>　共讀取到 <b>' + RAW.length + '</b> 筆待匯入資料', 'ok');
  $('panel').style.display = 'block';
  $('stTotal').textContent = RAW.length;
});

window.scan = async function(){
  $('btnScan').disabled = true;
  log('讀取現有資料…');
  const [rs, ev] = await Promise.all([
    getDoc(doc(db,'hr','resigned')),
    getDoc(doc(db,'hr','employees')),
  ]);
  curResigned  = rs.exists() ? (rs.data().list||[]) : [];
  curEmployees = ev.exists() ? (ev.data().list||[]) : [];
  log('現有離職同仁 ' + curResigned.length + ' 筆、在職同仁 ' + curEmployees.length + ' 筆');

  // 既有身分證與 姓名+店面 索引，用於去重
  const idSet = new Set();
  const nameLocSet = new Set();
  [...curResigned, ...curEmployees].forEach(p => {
    if (p.idNo) idSet.add(String(p.idNo).trim().toUpperCase());
    if (p.name) nameLocSet.add(p.name.trim() + '@' + normLoc(p.workLocation));
  });

  // 檔案內部也要去重（同一人重複出現）
  const seenId = new Set(), seenNameLoc = new Set();
  toImport = [];
  const rows = [];

  RAW.forEach(r => {
    const idKey = r.idNo ? r.idNo.toUpperCase() : '';
    const nlKey = r.name + '@' + normLoc(r.workLocation);
    let skip = '', reason = '';

    if (idKey && idSet.has(idKey))            { skip = 'skip'; reason = '系統已有相同身分證'; }
    else if (!idKey && nameLocSet.has(nlKey)) { skip = 'skip'; reason = '系統已有相同姓名+店面'; }
    else if (idKey && seenId.has(idKey))      { skip = 'skip'; reason = '檔案內重複'; }
    else if (!idKey && seenNameLoc.has(nlKey)){ skip = 'skip'; reason = '檔案內重複'; }

    if (!skip) {
      if (idKey) seenId.add(idKey);
      seenNameLoc.add(nlKey);
      toImport.push(r);
    }
    rows.push({ ...r, skip, reason });
  });

  const noBd = toImport.filter(r => !r.birthday).length;
  $('stNew').textContent  = toImport.length;
  $('stSkip').textContent = RAW.length - toImport.length;
  $('stNoBd').textContent = noBd;

  $('preview').innerHTML = '<div class="tw"><table><thead><tr>'
    + '<th>姓名</th><th>工作地點</th><th>生日</th><th>身分證</th><th>處理</th></tr></thead><tbody>'
    + rows.map(r => '<tr>'
        + '<td>' + r.name + '</td>'
        + '<td>' + (r.workLocation||'—') + '</td>'
        + '<td>' + (r.birthday || '<span class="tag t-nobd">待補</span>') + '</td>'
        + '<td>' + (r.idNo||'—') + '</td>'
        + '<td>' + (r.skip
            ? '<span class="tag t-skip">跳過</span> <span style="color:#94A3B8">' + r.reason + '</span>'
            : '<span class="tag t-new">新增</span>') + '</td>'
      + '</tr>').join('')
    + '</tbody></table></div>';

  log('比對完成：將新增 ' + toImport.length + ' 筆、跳過 ' + (RAW.length - toImport.length) + ' 筆');
  if (toImport.length) $('btnRun').disabled = false;
  else log('沒有需要新增的資料。');
};

window.run = async function(){
  if (!toImport.length) return;
  if (!confirm('確定要新增 ' + toImport.length + ' 筆歷史離職紀錄？\n\n系統會先自動建立「匯入前快照」，可還原。')) return;
  $('btnRun').disabled = true;

  try {
    // ① 匯入前自動快照
    log('建立匯入前快照…');
    const [ivS, evS, rsS] = await Promise.all([
      getDoc(doc(db,'hr','interviews')),
      getDoc(doc(db,'hr','employees')),
      getDoc(doc(db,'hr','resigned')),
    ]);
    const twNow  = new Date(Date.now() + 8*3600000);
    const snapId = 'presnap_' + twNow.toISOString().slice(0,16).replace('T','_').replace(':','-') + '_import';
    const snapIv = ivS.exists()? (ivS.data().list||[]) : [];
    const snapEv = evS.exists()? (evS.data().list||[]) : [];
    const snapRs = rsS.exists()? (rsS.data().list||[]) : [];
    await setDoc(doc(db,'hr_backups', snapId), {
      date: twNow.toISOString().slice(0,10),
      createdAt: new Date().toISOString(),
      manual: true, preRestore: true,
      note: '歷史離職名單匯入前自動快照',
      interviews: snapIv, employees: snapEv, resigned: snapRs,
      counts:{ employees:snapEv.length, resigned:snapRs.length, interviews:snapIv.length },
    });
    log('✅ 快照已建立：' + snapId);

    // ② 組成新紀錄
    const base = Date.now();
    const newRecords = toImport.map((r, i) => ({
      id: base + i,
      name: r.name,
      workLocation: r.workLocation,
      title: '正職同仁',
      status: '離職',
      birthday: r.birthday || '',
      idNo: r.idNo || '',
      startDate: '',
      resignDate: '',
      salary: 0,
      empNo: '', bankName: '', bankAccount: '', education: '',
      phone: '', email: '',
      note: '系統建立前歷史離職紀錄（批次匯入）',
      emergency: { name:'', relation:'', phone:'' },
      emergencyContacts: [],
      salaryHistory: [], performance: [], leaves: [], trainings: [],
      importedAt: new Date().toISOString(),
    }));

    // ③ 寫入（transaction 內只做寫，讀取已在外面完成）
    const merged = [...snapRs, ...newRecords];
    log('寫入 ' + merged.length + ' 筆（原有 ' + snapRs.length + ' + 新增 ' + newRecords.length + '）…');
    await runTransaction(db, async tx => {
      const vRef = doc(db,'hr','_version');
      const vSnap = await tx.get(vRef);
      const nextV = ((vSnap.exists()? vSnap.data().v : 0) || 0) + 1;
      tx.set(vRef, { v: nextV, lastEditor: me, lastEditAt: new Date().toISOString() });
      tx.set(doc(db,'hr','resigned'), { list: merged });
    });

    try { writeOpLog({ editor: me, role: 'admin', module: 'hr', action: '匯入歷史離職名單', detail: newRecords.length + '筆' }); } catch(_){}

    log('🎉 完成！離職同仁現共 ' + merged.length + ' 筆');
    setStatus('🎉 匯入完成，共新增 <b>' + newRecords.length + '</b> 筆。請重新整理「人員資訊 → 離職同仁」確認。', 'ok');
  } catch (e) {
    log('❌ 失敗：' + e.message);
    setStatus('❌ 匯入失敗：' + e.message + '<br>資料未變更，可重試。', 'err');
    $('btnRun').disabled = false;
  }
};
